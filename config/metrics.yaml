pool_filters:
  stable_only: true
  min_tvl_usd: 1000000
  min_history_days: 180
  max_full_pools: 250
  max_sample_pools: 30

yield_episodes:
  primary_threshold:
    type: absolute
    apy_percent: 10
  alternatives:
    - type: absolute
      apy_percent: 5
    - type: absolute
      apy_percent: 20
    - type: cross_sectional_percentile
      percentile: 90
  max_gap_days: 1

depeg:
  target_price_usd: 1.0
  minor_threshold: 0.005
  material_threshold: 0.01
  severe_threshold: 0.03
  event_window_days: 30

ranking:
  k_values: [10, 20]
  horizons_days: [1, 7, 30]

robustness:
  min_tvl_usd: [500000, 1000000, 5000000]
  min_history_days: [90, 180, 365]
  thresholds_percent: [5, 10, 20]
  gap_days: [0, 1, 3]
  winsor_limits: [0.01, 0.99]

